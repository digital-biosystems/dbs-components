<require from="./webllmchat.css"></require>
<require from="../w3.css"></require>

<div class="download-container">
      <select ref="modelSelection" value.bind="selectedModel"></select>
      <button id="download" click.trigger="clickDownload" class="w3-button w3-round w3-blue">
        Download
      </button>
</div>
<div class="progress-container">
  <div class="progress-bar" width.style="progressPercent+'%'"></div>
  <p id="download-status"
     class.bind="dsclass"
     style="white-space: nowrap;">
    ${reporttext}
  </p>
</div>
<div class="chat-container w3-small">
      <div ref="chatbox" class="chat-box"></div>
      <div ref="chatstats" class.bind="chatclass">${statsText}</div>
      <div class="chat-input-container">
        <input type="text" value.bind="userinput" placeholder.bind="placeholder" />
        <button id="send" disabled.bind="isdisabled" click.trigger="clickSend" class="w3-button w3-round w3-blue">Send</button>
      </div>
</div>
