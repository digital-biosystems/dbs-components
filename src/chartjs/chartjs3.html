<require from="./chartjs3.css"></require>
<div class="chartjs3-container">
    <canvas ref="mychart" class="chartjs3"></canvas>
</div>
Toxic level:<input type="range" min="0.005" max="0.05" step="0.001" value.bind="toxicLevel" class="slider"/>
Therapeutic level:<input type="range" min="0.001" max="0.05" step="0.001" value.bind="therapLevel" class="slider"/><br/>
<label for="drug-select">Choose a drug:</label>

  <option value="J01GA01">J01GA01 streptomycin</option>
  <option value="J01GA02">J01GA02 tobramycin</option>
  <option value="J01GB03">J01GB03 gentamicin</option>
